spring.application.name=HabitudeApplication

server.port=${PORT:8080}

# DB Config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


#JWT Config
security.jwtKey=${JWT_SECRET_KEY}
security.expirationTime=${JWT_EXPIRATION_TIME:6000000}
security.refreshTokenExpiration=${JWT_REFRESH_EXPIRATION:300000}

# Oauth2.0
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile


#redis configuration
# Redis Upstash Mapping
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}


# Cache TTL (Global)
spring.cache.redis.time-to-live=600000
spring.cache.type=redis
spring.cache.redis.cache-null-values=false



spring.ai.google.genai.api-key=${GEMINI_KEY}
spring.ai.vertex.ai.gemini.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
spring.ai.google.genai.chat.model=gemini-3.6-flash

